name: Daily Vault Auto-Updater

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run AI Vault Synthesizer & Slide Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_vault.py
          python generate_tiktok_slide.py

      - name: Commit and Push New Assets & Slides
        run: |
          git config --global user.name "Vault Auto-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json feed.xml sitemap.xml tiktok_slides/
          git diff --staged --quiet || git commit -m "Auto-update: Added daily vault systems and TikTok slide"
          git push
